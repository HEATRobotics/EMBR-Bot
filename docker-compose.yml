services:
  embr-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: embr-bot:simulation
    container_name: embr-simulation
    hostname: embr-raspberrypi

    links: 
      - "ember_robot_sim:gz_simulation"
    
    # Interactive terminal
    stdin_open: true
    tty: true
    
    # Environment variables
    environment:
      - ROS_DOMAIN_ID=0
    
    # Mount workspace for live development (optional)
    volumes:
      - ./ros2_ws:/workspace/ros2_ws:rw
    
    # Network configuration
    # network_mode: host
    
    # Resource limits (simulating Raspberry Pi 4)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G
    
    # Keep container running
    command: /bin/bash

  ember_robot_sim:
    build:
        context: ./LiDAR_Simulation
        dockerfile: Dockerfile
    container_name: ember_gz_sim
    image: gz_sim
    restart: "no"

    # network_mode: host
    # ipc: host

    environment:
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0

    working_dir: /home/ros/heatsim_ws
    user: ros
    stdin_open: true
    tty: true

    volumes:
      - ./LiDAR_Simulation/heatsim_ws:/home/ros/heatsim_ws

    security_opt:
      - seccomp:unconfined